<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/lugi.ico">
  <link rel="stylesheet" href="style.css">
  <title>luigibros.org</title>
</head>

<body class="home-page">

  <!-- Top Title Box -->
  <header class="header-box">
    <h1 class="header-title">luigibros.org</h1>
  </header>

  <!-- Main Section -->
  <div class="main-wrapper">
    
    <!-- Left Luigi Image -->
    <img src="images/luigicross.png" alt="Luigi Left" class="side-luigi left">

    <!-- Middle Content Box -->
    <main class="content-box">
      <p class="content-text">
        hi hello welcome to liuigbros.org
        this is my website for luigi and fun.
      </p>

      <nav class="wiki-links" aria-label="Wiki pages">
        <h2>and friends</h2>
        <ul>
          <li><a href="Luigi.html"><img src="images/lsprite.gif" alt="">Luigi</a></li>
          <li><a href="peach.html"><img src="images/psprite.gif" alt="">Peach</a></li>
          <li><a href="daisy.html"><img src="images/dsprite.gif" alt="">Daisy</a></li>
          <li><a href="waluigi.html"><img src="images/wlsprite.gif" alt="">Waluigi</a></li>
          <li><a href="wario.html"><img src="images/wasprite.gif" alt="">Wario</a></li>
        </ul>
      </nav>

      <div class="laser-scene" aria-hidden="true">
        <img src="images/dieanime.png" alt="">
        <img class="miku" src="images/miku.gif" alt="">
      </div>
    </main>

    <!-- Right Luigi Image -->
    <img src="images/luigicross.png" alt="Luigi Right" class="side-luigi right">

  </div>

  <audio id="background-music" src="audio/index.wav" loop preload="auto"></audio>
  <button id="play-music" type="button" hidden>Play music</button>

  <script>
    const backgroundMusic = document.getElementById('background-music');
    const playMusicButton = document.getElementById('play-music');

    async function playMusic() {
      try {
        await backgroundMusic.play();
        playMusicButton.hidden = true;
      } catch (error) {
        if (error.name === 'NotAllowedError') {
          playMusicButton.hidden = false;
        } else {
          console.error('Unable to play audio/index.wav:', error);
          playMusicButton.hidden = false;
        }
      }
    }

    playMusicButton.addEventListener('click', playMusic);
    window.setTimeout(playMusic, 3000);
  </script>
</body>
</html>
