<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/lugi.ico">
  <title>liuigbros.org</title>
  <style>
    /* Full-screen background setting that allows scrolling */
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Background repeats or scales naturally, allowing the page to scroll */
      background: #1a1a2e url('images/background.gif') no-repeat center top;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 120vh; /* Makes the page tall enough to scroll */
      box-sizing: border-box;
    }

    /* Top Title Container */
    .header-box {
      background-color: #4a90e2;
      width: 100%;
      max-width: 900px;
      padding: 20px 0;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .header-title {
  margin: 0;
  font-family: Impact, fantasy;
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(#fff36b 10%, #ff9a00 45%, #e21b00 85%);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  text-shadow:
    1px 1px #ff2b17,
    2px 2px #4b0600,
    3px 3px #a20d00,
    4px 4px #a85f00;
  animation: fire-glow 0.7s ease-in-out infinite alternate;
}

@keyframes fire-glow {
  from {
    filter: drop-shadow(0 0 4px #ff4b00);
  }
  to {
    filter: drop-shadow(0 0 10px #ffb000);
  }
}

@media (prefers-reduced-motion: reduce) {
  .header-title {
    animation: none;
  }
}

    /* Main Area containing Left Image, Center Box, and Right Image */
    .main-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 2100px;
      position: relative;
      margin-bottom: 50px;
    }

    /* Flanking Luigi Images */
    .side-luigi {
      width: 260px;
      height: auto;
      z-index: 2;
      flex-shrink: 0;
    }

    .side-luigi.right {
      transform: scaleX(-1);
    }

    /* Central Blue Content Box - Made longer */
    .content-box {
      background-color: #4a90e2;
      width: 100%;
      max-width: 1000px;
      min-height: 1050px;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 1;
      margin: 0 -15px;
    }

    .content-text {
      font-size: 32px;
      color: #0e132e;
      line-height: 1.4;
      margin: 0;
    }

    .wiki-links {
      margin-top: auto;
      padding-top: 24px;
    }

    .wiki-links h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .wiki-links ul {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 24px;
    }

    .wiki-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .wiki-links img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .laser-scene {
      position: absolute;
      right: 30px;
      bottom: 30px;
      width: 32%;
      max-width: 320px;
      aspect-ratio: 500 / 420;
      pointer-events: none;
    }

    .laser-scene img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .laser-scene .miku {
      width: 37.5%;
      height: auto;
      right: 39%;
      bottom: 47%;
    }

    .content-box a {
      color: #002266;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Top Title Box -->
  <header class="header-box">
    <h1 class="header-title">liuigbros.org</h1>
  </header>

  <!-- Main Section -->
  <div class="main-wrapper">
    
    <!-- Left Luigi Image -->
    <img src="images/luigicross.png" alt="Luigi Left" class="side-luigi left">

    <!-- Middle Content Box -->
    <main class="content-box">
      <p class="content-text">
        hi hello welcome to liuigbros.org
        this is my website for luigi and fun.
      </p>

      <nav class="wiki-links" aria-label="Wiki pages">
        <h2>and friends</h2>
        <ul>
          <li><a href="Luigi.html"><img src="images/lsprite.gif" alt="">Luigi</a></li>
          <li><a href="peach.html"><img src="images/psprite.gif" alt="">Peach</a></li>
          <li><a href="daisy.html"><img src="images/dsprite.gif" alt="">Daisy</a></li>
          <li><a href="waluigi.html"><img src="images/wlsprite.gif" alt="">Waluigi</a></li>
          <li><a href="wario.html"><img src="images/wasprite.gif" alt="">Wario</a></li>
        </ul>
      </nav>

      <div class="laser-scene" aria-hidden="true">
        <img src="images/dieanime.png" alt="">
        <img class="miku" src="images/miku.gif" alt="">
      </div>
    </main>

    <!-- Right Luigi Image -->
    <img src="images/luigicross.png" alt="Luigi Right" class="side-luigi right">

  </div>

</body>
</html>
