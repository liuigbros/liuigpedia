<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/lugi.ico">
  <title>liuigbros.org</title>
  <style>
    /* Full-screen background setting that allows scrolling */
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Background repeats or scales naturally, allowing the page to scroll */
      background: #1a1a2e url('images/background.gif') no-repeat center top;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 120vh; /* Makes the page tall enough to scroll */
      box-sizing: border-box;
    }

    /* Top Title Container */
    .header-box {
      background-color: #4a90e2;
      width: 100%;
      max-width: 900px;
      padding: 20px 0;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .header-title {
      margin: 0;
      font-size: 38px;
      color: #333333;
      font-weight: normal;
    }

    /* Main Area containing Left Image, Center Box, and Right Image */
    .main-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 2100px;
      position: relative;
      margin-bottom: 50px;
    }

    /* Flanking Luigi Images */
    .side-luigi {
      width: 260px;
      height: auto;
      z-index: 2;
      flex-shrink: 0;
    }

    .side-luigi.right {
      transform: scaleX(-1);
    }

    /* Central Blue Content Box - Made longer */
    .content-box {
      background-color: #4a90e2;
      width: 100%;
      max-width: 850px;
      min-height: 1050px;
      padding: 30px;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 1;
      margin: 0 -15px;
    }

    .content-text {
      font-size: 32px;
      color: #4a4a4a;
      line-height: 1.4;
      margin: 0;
    }

    .content-box a {
      color: #002266;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Top Title Box -->
  <header class="header-box">
    <h1 class="header-title">liuigbros.org</h1>
  </header>

  <!-- Main Section -->
  <div class="main-wrapper">
    
    <!-- Left Luigi Image -->
    <img src="images/luigicross.png" alt="Luigi Left" class="side-luigi left">

    <!-- Middle Content Box -->
    <main class="content-box">
      <p class="content-text">
        hi hello welcome to liuigbros.org
        this is my website for luigi and fun.<br><br>

        pages:
        
        <a href="luigi.html">wiki pages</a>
      </p>
    </main>

    <!-- Right Luigi Image -->
    <img src="images/luigicross.png" alt="Luigi Right" class="side-luigi right">

  </div>

</body>
</html>
