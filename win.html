<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOU WINIGI!!!</title>
  <style>
    /* Reset margins and make the body fit the exact browser viewport */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevents scrollbars from appearing */
      background-color: #000000;
    }

    /* Container to hold the image full screen */
    .full-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Stretches/scales image to fill every pixel */
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Image (Clicking it anywhere will also trigger the audio as a backup) -->
  <img src="images/win.jpg" alt="ARG" class="full-image" id="trollImage">

  <!-- Audio Element -->
  <audio id="trollSound" src="audio/win.wav" autoplay loop preload="auto"></audio>

  <script>
    const sound = document.getElementById('trollSound');
    const image = document.getElementById('trollImage');

    // Modern browsers block audio from playing automatically without user interaction.
    // This fallback ensures that if auto-play fails, clicking anywhere plays the sound!
    window.addEventListener('click', () => {
      if (sound.paused) {
        sound.play();
      }
    });

    image.addEventListener('click', () => {
      sound.currentTime = 0; // Rewinds and replays sound on click for extra effect
      sound.play();
    });
  </script>

</body>
</html>
