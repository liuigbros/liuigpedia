<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOU WINIGI!!!</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    .full-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <img src="images/win.jpg" alt="ARG" class="full-image" id="trollImage">

  <audio id="trollSound" src="audio/win.wav" autoplay loop preload="auto"></audio>

  <script>
    const sound = document.getElementById('trollSound');
    const image = document.getElementById('trollImage');

    window.addEventListener('click', () => {
      if (sound.paused) {
        sound.play();
      }
    });

    image.addEventListener('click', () => {
      sound.currentTime = 0;
      sound.play();
    });
  </script>

</body>
</html>
